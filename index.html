
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Modern Touch Renovations | Elite Renovation Firm Southern Ontario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html {
            -webkit-text-size-adjust: 100%;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0A0A;
            color: #FFFFFF;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* Border Beam Animation */
        @keyframes border-beam {
            from { offset-distance: 0%; }
            to { offset-distance: 100%; }
        }

        .border-beam-container {
            position: relative;
            border-radius: 0.75rem;
            padding: 1px;
            overflow: hidden;
        }

        .border-beam {
            pointer-events: none;
            position: absolute;
            inset: 0;
            border: 1px solid transparent;
            border-radius: inherit;
            mask-clip: content-box, border-box;
            mask-composite: intersect;
            mask-image: linear-gradient(transparent, transparent), linear-gradient(#fff, #fff);
        }

        .border-beam::after {
            content: "";
            position: absolute;
            aspect-ratio: 1;
            width: 150px;
            background: linear-gradient(to right, #C5A059, #F5D18A, transparent);
            offset-path: rect(0 auto auto 0 round 0.75rem);
            animation: border-beam 4s linear infinite;
        }

        /* Subtle Background Gradient Drift */
        @keyframes drift {
            0% { transform: translate(0, 0); }
            50% { transform: translate(2%, 2%); }
            100% { transform: translate(0, 0); }
        }

        .bg-drift {
            animation: drift 15s ease-in-out infinite;
            filter: blur(100px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0A0A0A;
        }
        ::-webkit-scrollbar-thumb {
            background: #1A1A1A;
            border-radius: 10px;
            border: 2px solid #0A0A0A;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #C5A059;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#0A0A0A',
                            accent: '#C5A059', // Metallic Gold
                            accentLight: '#F5D18A',
                            success: '#22C55E'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
